# User overrides for makepkg (used by yay/paru for AUR builds).
# Loaded after /etc/makepkg.conf, so only changed values are listed here.

# Compile on every CPU core instead of one.
MAKEFLAGS="--jobs=$(nproc)"

# Skip package test suites (check) and separate debug packages (debug).
# LTO is turned off too: it makes AUR builds much slower for little gain.
BUILDENV=(!distcc color !ccache !check !sign)
OPTIONS=(strip docs !libtool !staticlibs emptydirs zipman purge !debug !lto)
